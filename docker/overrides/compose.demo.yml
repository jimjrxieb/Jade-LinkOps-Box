version: '3.8'

services:
  # Frontend Demo
  demo-frontend:
    build: ../../frontend
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - demo-rag
      - ml-models

  # Demo RAG Service
  demo-rag:
    build: ../../rag
    ports:
      - "8001:8005"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-demo-key}
    volumes:
      - ../../rag/vectorstore:/app/vectorstore
      - ../../db/demo_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ML Models Service  
  ml-models:
    build: ../../ml-models
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://user:pass@demo-db:5432/demo_linkops
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-demo@example.com}
      - SMTP_PASS=${SMTP_PASS:-demo-pass}
    volumes:
      - ../../ml-models/models:/app/models
      - ../../db/demo_data:/app/data
    depends_on:
      - demo-db

  # Demo Database
  demo-db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=demo_linkops
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d demo_linkops"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  demo_postgres_data: 