global:
  namespace: demo-linkops
  imagePullPolicy: IfNotPresent

frontend:
  image: demo-linkops-frontend:latest
  port: 80

api:
  image: demo-linkops-api:latest
  port: 8000

rag:
  image: demo-linkops-rag:latest
  port: 8001

sync:
  image: demo-linkops-sync:latest
  port: 9000

models:
  image: demo-linkops-models:latest
  port: 8500

pipeline:
  image: demo-linkops-pipeline:latest
  port: 8003

postgresql:
  enabled: true
  user: postgres
  password: postgres
  db: jadebox

redis:
  enabled: true

service:
  type: ClusterIP
  frontend:
    port: 80
  unifiedApi:
    port: 9000
  rag:
    port: 8005
  mlModels:
    port: 8002
  pipeline:
    port: 8003
  syncEngine:
    port: 8004

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: demo.local
      paths:
        - path: /
          service: frontend
          port: 80
        - path: /api
          service: unified-api
          port: 9000
        - path: /rag
          service: rag
          port: 8005
        - path: /ml
          service: ml-models
          port: 8002
        - path: /pipeline
          service: pipeline
          port: 8003
        - path: /sync
          service: sync-engine
          port: 8004
  tls: []

resources:
  frontend:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  unifiedApi:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  rag:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  mlModels:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  pipeline:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  syncEngine:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: true
  vectorstore:
    size: 1Gi
    storageClass: "standard"
  database:
    size: 1Gi
    storageClass: "standard"

config:
  jwt:
    secretKey: "demo-secret-key"
    accessTokenExpireMinutes: 30
    refreshTokenExpireDays: 7
  api:
    host: "0.0.0.0"
    port: 8000
    logLevel: "INFO"
  frontend:
    apiUrl: "/api"
    ragUrl: "/rag"
    nodeEnv: "production"
  rag:
    host: "0.0.0.0"
    port: 8001
    vectorDbPath: "/app/data/vectorstore"
  monitoring:
    enabled: true
    metricsPort: 9090

# ZRS Property Management Tools Configuration
zrs:
  enabled: true
  tools:
    mcp_tools_path: /app/db/mcp_tools
    scripts_path: /app/tools
    datasets_path: /app/htc/datasets
    prompts_path: /app/htc/prompts
  
  # ZRS Training Configuration
  training:
    enabled: true
    model_name: "microsoft/DialoGPT-small"
    dataset_file: "zrs_property_finetune.jsonl"
    output_path: "/app/models/jade-zrs-property"
    
  # ZRS Tool Configuration
  tools_config:
    - name: "send_late_notice"
      description: "Send late rent notice to tenant"
      timeout: 30
      retry_count: 3
    - name: "notify_maintenance" 
      description: "Alert maintenance team with priority assignment"
      timeout: 30
      retry_count: 2
    - name: "vendor_suggest"
      description: "Recommend ZRS-approved vendors"
      timeout: 45
      retry_count: 2
    - name: "schedule_turnover"
      description: "Schedule unit cleaning and inspection"
      timeout: 60
      retry_count: 2
    - name: "query_delinquency"
      description: "Analyze tenant payment data"
      timeout: 30
      retry_count: 2
    - name: "broadcast_notice"
      description: "Send mass notifications to tenants"
      timeout: 120
      retry_count: 3

  # ZRS Data persistence
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "standard"
    mount_path: /app/zrs-data 